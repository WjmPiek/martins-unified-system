{% extends "base.html" %}
{% block auth_content %}
<section class="login-card" aria-label="Martins login">
    <div class="login-branding" aria-label="Martins System">
        <img
            class="login-logo"
            src="{{ brand_logo_url }}"
            alt="Martins logo"
            width="220"
            height="100"
            loading="eager"
            decoding="async"
            fetchpriority="high"
            onerror="this.onerror=null;this.src='{{ brand_logo_fallback_url }}';"
        >
        <h1>Martins System</h1>
        <p>Martins Funeral System</p>
    </div>

    <form method="post" class="login-form">
        <label for="login-email">Username</label>
        <input id="login-email" type="email" name="email" autocomplete="username" required>

        <label for="login-password">Password</label>
        <div class="login-password-row">
            <input id="login-password" type="password" name="password" autocomplete="current-password" required>
            <button class="login-password-toggle" type="button" onclick="var field=document.getElementById('login-password'); field.type = field.type === 'password' ? 'text' : 'password'; this.textContent = field.type === 'password' ? 'Show' : 'Hide';">Show</button>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="login-links">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('auth.register') }}">Register account</a>
    </div>
</section>
{% endblock %}
