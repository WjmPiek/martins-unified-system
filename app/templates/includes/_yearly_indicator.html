{% macro yearly_arrow(row) -%}
<span class="yearly-indicator yearly-{{ row.yearly_direction|default('unavailable') }}" role="img" aria-label="{{ row.yearly_label|default('No comparable data last year') }}" title="{{ row.yearly_label|default('No comparable data last year') }}">{% if row.yearly_direction in ['up', 'down'] %}<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 20V4M5 11l7-7 7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>{% else %}<span aria-hidden="true">—</span>{% endif %}</span>
{%- endmacro %}
